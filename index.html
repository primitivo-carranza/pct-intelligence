<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1a30"><title>PCT Intelligence · Engineering Resources</title><style>
:root{font-family:system-ui,sans-serif;color:#16233a;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#101d32;color:white;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}header h1{margin:0;font-size:25px}small{color:#b8c6df}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 5vw;background:white;box-shadow:0 1px 5px #aaa5}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px}button{background:#eaf1fc;cursor:pointer}button.primary{background:#1265cf;color:white;border:0}nav button.active{background:#1265cf;color:white}main{padding:24px 5vw;max-width:1500px;margin:auto}h2{margin-top:0}section{background:white;padding:20px;margin-bottom:15px;border:1px solid #dfe6f0;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #e1e7f0;font-size:13px}th{background:#f1f5fa}#rows{overflow:auto}label{display:block;margin:11px 0 4px}input,select,textarea{width:100%;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#f5f8ff;padding:16px;border-radius:9px}.metric strong{font-size:30px;display:block}.muted{color:#64748b}.notice{border-left:4px solid #eab308;background:#fff8e5;padding:12px;margin-bottom:15px}a{color:#1265cf}@media(max-width:700px){header{padding:15px}main{padding:14px}nav{padding:10px;overflow:auto}table{min-width:730px}} </style></head><body><header><div><h1>◈ PCT Intelligence</h1><small>Engineering Resources · Inteligencia competitiva y tecnológica</small></div><span id="today"></span></header><nav id="tabs"></nav><main id="app"></main><script>
const KEY='pct-intelligence-v1';const tabs=['Panel','Proyectos','Señales','Competidores','Clientes','Oportunidades','Fuentes','Revisión semanal','Configuración'];let state=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"signals":[],"competitors":[],"clients":[],"opportunities":[],"sources":[],"reviews":[]}');let current='Panel';let feedCount=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES');
const defs={
'Proyectos':{key:'projects',fields:[['name','Proyecto'],['country','País'],['sector','Sector'],['capex','CAPEX (€M)'],['owner','Promotor'],['epc','EPC'],['phase','Fase'],['source','Fuente / URL']]},
'Señales':{key:'signals',fields:[['name','Titular'],['country','País'],['sector','Sector'],['kind','Tipo'],['date','Fecha'],['source','Fuente / URL'],['status','Verificación']]},
'Competidores':{key:'competitors',fields:[['name','Empresa'],['country','País'],['specialty','Especialidad'],['source','Fuente / URL'],['notes','Observaciones']]},
'Clientes':{key:'clients',fields:[['name','Empresa'],['country','País'],['sector','Sector'],['contact','Contacto'],['source','Fuente / URL']]},
'Oportunidades':{key:'opportunities',fields:[['name','Oportunidad'],['country','País'],['client','Cliente'],['value','Valor (€)'],['phase','Fase comercial'],['owner','Responsable'],['next','Próxima acción']]},
'Fuentes':{key:'sources',fields:[['name','Organismo / Fuente'],['country','País'],['kind','Tipo'],['source','URL'],['frequency','Periodicidad']]},
'Revisión semanal':{key:'reviews',fields:[['name','Semana / Fecha'],['summary','Hallazgos'],['actions','Acciones comerciales'],['owner','Responsable']]}
};
function tabsRender(){document.getElementById('tabs').innerHTML=tabs.map(t=>'<button class="'+(current===t?'active':'')+'" data-tab="'+esc(t)+'">'+esc(t)+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()})}
function render(){tabsRender();let root=document.getElementById('app');if(current==='Panel'){let count=k=>state[k]?.length||0;root.innerHTML='<h2>Panel estratégico</h2><div class="notice">La información registrada en el navegador es privada y local a este dispositivo. Los feeds públicos externos requieren validación comercial antes de incorporarlos al pipeline.</div><div class="grid">'+[['Proyectos',count('projects')],['Señales',count('signals')],['Competidores',count('competitors')],['Clientes',count('clients')],['Oportunidades',count('opportunities')],['Señales feed público',feedCount]].map(x=>'<div class="metric"><strong>'+x[1]+'</strong>'+x[0]+'</div>').join('')+'</div><section><h3>Metodología PCT</h3><p>Mercado → proyectos → clientes → competidores → señales tecnológicas/normativas → decisión comercial.</p><p>Registrar cada proyecto por país, sector, promotor, CAPEX, fase de adjudicación y fuentes verificables. Revisar semanalmente cambios de fase y próximas acciones.</p><button class="primary" onclick="current=\'Proyectos\';render()">Abrir radar de proyectos</button></section>';return}
if(current==='Configuración'){root.innerHTML='<h2>Configuración y datos</h2><section><p><b>Exportar copia JSON</b> de todos tus registros locales.</p><button id="export">Exportar JSON</button><label>Importar JSON</label><input id="import" type="file" accept=".json,application/json"><p class="muted">La importación sustituye los datos locales: exporta primero una copia de seguridad.</p><button id="sync">Consultar feed de señales públicas</button><div id="feedstatus" class="muted"></div></section>';document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pct-intelligence-backup.json';a.click()};document.getElementById('import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Object.keys(defs).some(k=>Array.isArray(v[defs[k].key])))throw Error('Archivo incompatible');state=v;save();alert('Importación completada');render()}catch(err){alert(err.message)}};document.getElementById('sync').onclick=fetchFeed;return}
let d=defs[current],rows=state[d.key]||[];root.innerHTML='<h2>'+esc(current)+' <span class="muted">('+rows.length+')</span></h2><section><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="primary" id="add">Añadir registro</button><input id="filter" style="width:min(400px,100%)" placeholder="Buscar por palabra, país, empresa..."></div><div id="rows"></div></section><section id="formbox" hidden><h3>Nuevo registro</h3><form id="frm">'+d.fields.map(([k,l])=>'<label>'+esc(l)+'</label><input name="'+k+'" required="'+(k==='name'?'required':'')+'">').join('')+'<p><button type="submit" class="primary">Guardar registro</button> <button type="button" id="cancel">Cancelar</button></p></form></section>';let box=document.getElementById('rows');function draw(q=''){let items=rows.map((r,i)=>({...r,_i:i})).filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));box.innerHTML='<table><thead><tr>'+d.fields.map(f=>'<th>'+esc(f[1])+'</th>').join('')+'<th></th></tr></thead><tbody>'+items.map(r=>'<tr>'+d.fields.map(([k])=>'<td>'+(/source/.test(k)&&/^https?:\/\//.test(r[k]||'')?'<a target="_blank" rel="noopener" href="'+esc(r[k])+'">Fuente ↗</a>':esc(r[k]))+'</td>').join('')+'<td><button data-del="'+r._i+'">Eliminar</button></td></tr>').join('')+'</tbody></table>';box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este registro?')){state[d.key].splice(+b.dataset.del,1);save();render()}})}draw();document.getElementById('filter').oninput=e=>draw(e.target.value);document.getElementById('add').onclick=()=>document.getElementById('formbox').hidden=false;document.getElementById('cancel').onclick=()=>document.getElementById('formbox').hidden=true;document.getElementById('frm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));state[d.key].push(v);save();render()}
}
async function fetchFeed(){let o=document.getElementById('feedstatus');o.textContent='Consultando…';try{let r=await fetch('data/weekly-feed.json?b='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);let feed=await r.json();let s=feed.signals||[];let known=new Set(state.signals.map(x=>x.source||x.name));let added=0;for(let it of s){let src=it.url||it.source||'';if(known.has(src||it.title))continue;state.signals.push({name:it.title||it.name||'',country:it.country||'',sector:it.sector||'',kind:it.kind||'Feed público',date:it.date||'',source:src,status:'Pendiente de verificación'});known.add(src||it.title);added++}save();feedCount=s.length;o.textContent=added+' señales importadas. '+s.length+' señales en el feed. Consulta la sección Señales.'}catch(e){o.textContent='No se puede leer el feed: '+e.message}}
render();
</script></body></html>
