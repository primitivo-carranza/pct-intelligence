<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1a30"><title>PCT Intelligence · Engineering Resources</title><style>
:root{font-family:system-ui,sans-serif;color:#16233a;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#101d32;color:white;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}header h1{margin:0;font-size:25px}small{color:#b8c6df}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 5vw;background:white;box-shadow:0 1px 5px #aaa5}button,input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px}button{background:#eaf1fc;cursor:pointer}button.primary{background:#1265cf;color:white;border:0}nav button.active{background:#1265cf;color:white}main{padding:24px 5vw;max-width:1500px;margin:auto}h2{margin-top:0}section{background:white;padding:20px;margin-bottom:15px;border:1px solid #dfe6f0;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #e1e7f0;font-size:13px}th{background:#f1f5fa}#rows{overflow:auto}label{display:block;margin:11px 0 4px}input,select,textarea{width:100%;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#f5f8ff;padding:16px;border-radius:9px}.metric strong{font-size:30px;display:block}.muted{color:#64748b}.notice{border-left:4px solid #eab308;background:#fff8e5;padding:12px;margin-bottom:15px}a{color:#1265cf}@media(max-width:700px){header{padding:15px}main{padding:14px}nav{padding:10px;overflow:auto}table{min-width:730px}} </style></head><body><header><div><h1>◈ PCT Intelligence</h1><small>Engineering Resources · Inteligencia competitiva y tecnológica</small></div><span id="today"></span></header><nav id="tabs"></nav><main id="app"></main><script src="sync.js"></script><script>
const KEY='pct-intelligence-v1';const tabs=['Panel','Proyectos','Señales','Competidores','Clientes','Oportunidades','Fuentes','Revisión semanal','Configuración'];const empty=()=>Object.fromEntries(PCTSync.keys.map(k=>[k,[]]));let state;let storageError='';try{state=PCTSync.normalize(JSON.parse(localStorage.getItem(KEY)||JSON.stringify(empty())))}catch(e){state=PCTSync.normalize(empty());storageError='No se pudieron leer los datos locales. Exporta o recupera tu copia antes de guardar cambios.'}let current='Panel';let feedCount=0;let syncMessage='Consultando datos compartidos…';let syncing=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=next=>{if(storageError)throw Error(storageError);localStorage.setItem(KEY,JSON.stringify(next));state=next};const save=()=>persist(state);document.getElementById('today').textContent=new Date().toLocaleDateString('es-ES');
const defs={
'Proyectos':{key:'projects',fields:[['name','Proyecto'],['country','País'],['sector','Sector'],['capex','CAPEX (€M)'],['owner','Promotor'],['epc','EPC'],['phase','Fase'],['source','Fuente / URL']]},
'Señales':{key:'signals',fields:[['name','Titular'],['country','País'],['sector','Sector'],['kind','Tipo'],['date','Fecha'],['source','Fuente / URL'],['status','Verificación']]},
'Competidores':{key:'competitors',fields:[['name','Empresa'],['country','País'],['specialty','Especialidad'],['source','Fuente / URL'],['notes','Observaciones']]},
'Clientes':{key:'clients',fields:[['name','Empresa'],['country','País'],['sector','Sector'],['contact','Contacto'],['source','Fuente / URL']]},
'Oportunidades':{key:'opportunities',fields:[['name','Oportunidad'],['country','País'],['client','Cliente'],['value','Valor (€)'],['phase','Fase comercial'],['owner','Responsable'],['next','Próxima acción']]},
'Fuentes':{key:'sources',fields:[['name','Organismo / Fuente'],['country','País'],['kind','Tipo'],['source','URL'],['frequency','Periodicidad']]},
'Revisión semanal':{key:'reviews',fields:[['name','Semana / Fecha'],['summary','Hallazgos'],['actions','Acciones comerciales'],['owner','Responsable']]}
};
function tabsRender(){document.getElementById('tabs').innerHTML=tabs.map(t=>'<button class="'+(current===t?'active':'')+'" data-tab="'+esc(t)+'">'+esc(t)+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()})}
function render(){tabsRender();let root=document.getElementById('app');if(current==='Panel'){let count=k=>state[k]?.length||0;root.innerHTML='<h2>Panel estratégico</h2><p role="status">'+esc(syncMessage)+'</p><p class="muted">'+esc(state._sync.coverage||'')+'</p><div class="notice">Los datos públicos se actualizan al abrir la aplicación. Tus registros manuales permanecen en este navegador. Las empresas prospectadas y las hipótesis comerciales no son contratos ni proyectos confirmados.</div><div class="grid">'+[['Proyectos de obra',count('projects')],['Señales',count('signals')],['Competidores',count('competitors')],['Empresas prospectadas',count('clients')],['Oportunidades',count('opportunities')],['Países de proyectos',new Set(state.projects.map(p=>p.country).filter(Boolean)).size]].map(x=>'<div class="metric"><strong>'+x[1]+'</strong>'+x[0]+'</div>').join('')+'</div><section><h3>Metodología PCT</h3><p>Mercado → proyectos → clientes → competidores → señales tecnológicas/normativas → decisión comercial.</p><p>Registrar cada proyecto por país, sector, promotor, CAPEX, fase de adjudicación y fuentes verificables. Revisar semanalmente cambios de fase y próximas acciones.</p><button class="primary" onclick="current=\'Proyectos\';render()">Abrir radar de proyectos</button></section>';return}
if(current==='Configuración'){root.innerHTML='<h2>Configuración y datos</h2><section><p><b>Exportar copia JSON</b> de todos tus registros locales.</p><button id="export">Exportar JSON</button><label>Importar JSON</label><input id="import" type="file" accept=".json,application/json"><p class="muted">La importación añade registros sin sustituir los existentes. Exporta una copia de seguridad antes de importar. Las notas comerciales y contactos privados deben mantenerse en tu copia local.</p><button id="sync">Actualizar todos los apartados</button><div id="feedstatus" class="muted" role="status">'+esc(syncMessage)+'</div><p>Última edición compartida: '+esc(state._sync.generatedAt||'Sin sincronizar')+'</p><p>'+esc(state._sync.coverage||'')+'</p></section>';document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pct-intelligence-backup.json';a.click()};document.getElementById('import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());let result=PCTSync.merge(state,v,false);localStorage.setItem(KEY+'-before-import',JSON.stringify(state));persist(result.state);alert(result.stats.added+' registros añadidos; '+result.stats.preserved+' existentes conservados');render()}catch(err){alert(err.message)}};document.getElementById('sync').onclick=fetchFeed;return}
let d=defs[current],rows=state[d.key]||[];root.innerHTML='<h2>'+esc(current)+' <span class="muted">('+rows.length+')</span></h2><section><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="primary" id="add">Añadir registro</button><input id="filter" style="width:min(400px,100%)" placeholder="Buscar por palabra, país, empresa..."></div><div id="rows"></div></section><section id="formbox" hidden><h3>Nuevo registro</h3><form id="frm">'+d.fields.map(([k,l])=>'<label>'+esc(l)+'</label><input name="'+k+'" '+(k==='name'?'required':'')+'>').join('')+'<p><button type="submit" class="primary">Guardar registro</button> <button type="button" id="cancel">Cancelar</button></p></form></section>';let box=document.getElementById('rows');function draw(q=''){let items=rows.map((r,i)=>({...r,_i:i})).filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));box.innerHTML='<table><thead><tr>'+d.fields.map(f=>'<th>'+esc(f[1])+'</th>').join('')+'<th>Procedencia</th><th></th></tr></thead><tbody>'+items.map(r=>'<tr>'+d.fields.map(([k])=>'<td>'+(/source/.test(k)&&/^https?:\/\//.test(r[k]||'')?'<a target="_blank" rel="noopener" href="'+esc(r[k])+'">Fuente ↗</a>':esc(r[k]))+'</td>').join('')+'<td>'+esc(r._feed?'Compartido':'Local')+'</td><td><button data-del="'+r._i+'">Eliminar</button></td></tr>').join('')+'</tbody></table>';box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este registro?')){try{persist(PCTSync.dismiss(state,d.key,+b.dataset.del));render()}catch(e){alert(e.message)}}})}draw();document.getElementById('filter').oninput=e=>draw(e.target.value);document.getElementById('add').onclick=()=>document.getElementById('formbox').hidden=false;document.getElementById('cancel').onclick=()=>document.getElementById('formbox').hidden=true;document.getElementById('frm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));try{let next=PCTSync.normalize(state);next[d.key].push(v);persist(next);render()}catch(e){alert(e.message)}}
}
async function fetchFeed(){if(syncing)return;syncing=true;try{let r=await fetch('data/weekly-feed.json?b='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let feed=await r.json();let result=PCTSync.merge(state,feed,true);persist(result.state);feedCount=(feed.signals||[]).length;syncMessage='Actualizado: '+result.stats.added+' nuevos, '+result.stats.updated+' modificados; '+result.stats.preserved+' registros locales conservados. Edición: '+(feed.generatedAt||'sin fecha')+'.'}catch(e){syncMessage='No se han actualizado los datos: '+e.message+'. Se conservan los registros anteriores.'}finally{syncing=false;if(current==='Panel'||current==='Configuración')render()}}

render();fetchFeed();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')fetchFeed()});
</script></body></html>
